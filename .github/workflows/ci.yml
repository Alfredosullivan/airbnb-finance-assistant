name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar ESLint
        run: npm run lint

      - name: Verificar formato Prettier
        run: npm run format:check

      - name: Auditoría de seguridad (npm audit)
        run: npm audit --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_not_for_production

      - name: Subir reporte de coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 30

  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [lint, test, secrets]
    permissions:
      security-events: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t airbnb-finance-assistant:ci .

      - name: Escanear imagen con Trivy (tabla en log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: airbnb-finance-assistant:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln

      - name: Generar reporte SARIF para GitHub Security
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: airbnb-finance-assistant:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln

      - name: Subir reporte a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
